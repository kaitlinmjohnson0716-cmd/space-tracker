name: daily
on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "17 18 * * *"   # backup: a second run on the same day replaces that day's data
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pipeline (download, history, status, issue)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tracker.run
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/history.csv data/status.json data/source_log.csv
          git commit -m "Daily run $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase
          git push
